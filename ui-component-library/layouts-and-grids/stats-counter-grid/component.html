<!-- ==========================================================================
     COUNT-UP STATS GRID
     4-Column responsive metrics board featuring:
     - Warm ivory backing with hairline border
     - 56px editorial serif numbers with crimson suffix
     - Tracked small-caps labels
     - Animated count-up observer
     ========================================================================== -->

<div class="stats-grid" id="statsCounterGrid">
  <div class="stat-item">
    <div class="stat-number-wrap">
      <span class="stat-val" data-target="12">12</span>
      <span class="stat-suffix">+</span>
    </div>
    <div class="stat-label">Years of Fine Art Artistry</div>
  </div>

  <div class="stat-item">
    <div class="stat-number-wrap">
      <span class="stat-val" data-target="450">450</span>
      <span class="stat-suffix">+</span>
    </div>
    <div class="stat-label">Weddings Documented</div>
  </div>

  <div class="stat-item">
    <div class="stat-number-wrap">
      <span class="stat-val" data-target="28">28</span>
      <span class="stat-suffix"></span>
    </div>
    <div class="stat-label">Countries &amp; Destinations</div>
  </div>

  <div class="stat-item">
    <div class="stat-number-wrap">
      <span class="stat-val" data-target="100">100</span>
      <span class="stat-suffix">%</span>
    </div>
    <div class="stat-label">Client Satisfaction</div>
  </div>
</div>
