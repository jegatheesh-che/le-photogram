<!-- ==========================================================================
     CURTAIN REVEAL IMAGE EFFECT
     Editorial unmasking curtain transition:
     - Outer wrapper holds the image and optional caption
     - A solid porcelain curtain panel slides upward on scroll or trigger
     - Features an architectural crimson leading edge line
     - Replayable trigger included for live demo testing
     ========================================================================== -->

<div class="curtain-reveal-container" id="curtainRevealDemo">
  <div class="curtain-reveal-wrap">
    <img 
      src="../../assets/images/img24.webp" 
      alt="Château de Tourreau, Provence — Editorial Curtain Reveal" 
      class="curtain-reveal-img" 
      loading="lazy" 
    />
    <div class="curtain-panel" aria-hidden="true">
      <div class="curtain-lead-line"></div>
    </div>
  </div>

  <div class="curtain-controls">
    <span class="curtain-status-text">Scroll or press to replay reveal:</span>
    <button type="button" class="curtain-replay-btn" id="curtainReplayBtn">Replay Curtain Reveal</button>
  </div>
</div>
