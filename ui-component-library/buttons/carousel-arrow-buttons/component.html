<!-- ==========================================================================
     CAROUSEL ARROW NAVIGATION BUTTONS
     Circular crimson directional controls with SVG arrows, hover lift, and press feedback.
     ========================================================================== -->

<div class="carousel-arrows" id="carouselArrowButtons">
  <button type="button" class="arrow-btn arrow-prev" aria-label="Previous slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </button>
  <button type="button" class="arrow-btn arrow-next" aria-label="Next slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
  </button>
</div>
