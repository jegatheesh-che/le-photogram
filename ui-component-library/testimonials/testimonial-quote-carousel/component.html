<!-- ==========================================================================
     ARCHITECTURAL TESTIMONIAL QUOTE CAROUSEL
     Warm ivory centerpiece quote board featuring:
     - 72px signature crimson quotation glyph
     - Italic Cormorant Garamond quote text
     - Author metadata row with photo avatar and crimson location
     - Slide counter and custom circular arrow navigation controls
     ========================================================================== -->

<div class="testimonials-card" id="testimonialQuoteCarousel">
  <span class="testimonial-quote-mark" aria-hidden="true">&ldquo;</span>
  
  <p class="testimonial-quote">
    “Every photograph feels honest and completely us. We couldn't have asked for a more beautiful way to remember our day. The film brings our grandparents' smiles right back to life every time we press play.”
  </p>

  <div class="testimonial-author-row">
    <img src="../../assets/images/img35.webp" alt="Couple testimonial portrait" class="testimonial-avatar" />
    <div class="testimonial-author-meta">
      <span class="testimonial-name">Riya &amp; Arjun</span>
      <span class="testimonial-location">Lake Como, Italy</span>
    </div>
  </div>

  <div class="carousel-arrows">
    <button type="button" class="arrow-btn testimonial-prev" aria-label="Previous testimonial">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    
    <div class="testimonial-slide-counter">
      <span class="t-current-index">01</span>
      <span>/</span>
      <span>04</span>
    </div>

    <button type="button" class="arrow-btn testimonial-next" aria-label="Next testimonial">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>
