<!-- ==========================================================================
     CINEMATIC VIDEO BACKGROUND HERO SECTION
     Full-viewport luxury opening with background video loop, dark luxury overlay,
     inverted logo wordmark, tracked uppercase tagline, and scroll indicator.
     ========================================================================== -->

<section class="hero-section" id="heroSection">
  <div class="hero-card">
    <video class="hero-video-bg" autoplay loop muted playsinline poster="../../assets/images/img1.webp">
      <source src="../../assets/videos/hero-preview.mp4" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-content-inner">
        <h1 class="hero-wordmark">
          <img src="../../assets/brand/logo-wordmark-black.png" alt="Le PhotoGRAM" class="hero-logo-img" />
        </h1>
        <p class="hero-tagline">Fine Art Wedding Photography &amp; Motion Picture</p>
      </div>
    </div>
    <div class="hero-scroll-cue" aria-hidden="true">
      <span class="scroll-cue-text">Scroll to Explore</span>
      <div class="scroll-cue-line"></div>
    </div>
  </div>
</section>
